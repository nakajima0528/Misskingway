<head><meta charset="UTF-8"><title>メンテナンス中 - Misskingway</title><meta name="description" content="Misskingwayはメンテナンス中です。終了までしばらくお待ち下さい。" /><meta name="viewport" content="width=device-width, initial-scale=1" /><link rel="icon" href="https://s3.invillage-outvillage.com/misskey/fec65b18-9afc-4171-a611-79234a33d728.png" id="favicon" />
<style>
@charset "utf-8";

/* Global tags and classes */
:root {
    --mw-dark-blue: oklch(30% 0.20 240deg);
    --mw-link-blue: oklch(50% 0.3 240deg);
    --mw-light-blue: oklch(80% 0.3 240deg);
    --mw-font-family: "Yu Gothic medium", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "sans-serif", Meiryo;
    font-family: var(--mw-font-family);
}

* {
    margin: 0;
}

html, body {
    height: 100%;
}

img {
    max-width: 100%;
    height: auto;
    vertical-align: middle;
}

a {
    color: var(--mw-link-blue);
    text-decoration: none;
}

a > img:hover {
    filter: brightness(1.1);
}

a:hover {
    color: var(--mw-light-blue)
}

.block {
    display: block;
}

.inline-block {
    display: inline-block;
}

.text-xl {
    font-size: 2.5rem;
}

.text-large {
    font-size: 1.5rem
}

.text-bold {
    font-weight: 600;
}

.text-spacing {
    letter-spacing: 0.25rem;
}

.text-center {
    text-align: center;
}

/* Project specific */
.maintenance.container {
    max-width: 50rem;
    margin-inline: auto;
    padding: 1rem;
    align-content: center;
    height: calc(100svh - 2rem);
}

.banner {
    border: 6px solid var(--mw-dark-blue);
    border-radius: 12px;
}

.banner > header, .admin-message-box > header {
    background-color: var(--mw-dark-blue);
    color: whitesmoke;
    padding-block: 1rem;
}

.banner main {
    padding: 1rem;
}

.main-message {
    font-size: 2rem;
    border-bottom: 3px solid var(--mw-dark-blue);
    margin-inline: 1rem;
    padding-block: 1rem;
}

.messaging-image {
    margin-block: 2rem;
}

.maintenance.container button {
    border: 0 solid;
    background-color: var(--mw-link-blue);
    color: whitesmoke;
    padding: 0.8rem;
    margin: 0.5rem;
    border-radius: 0.5rem/0.5rem;
    cursor: pointer;
    font-size: 1rem;
}

.maintenance.container button:disabled {
    background-color: gray;
    cursor: not-allowed;
}

.maintenance.container button:enabled:hover {
    background-color: var(--mw-light-blue);
}

.maintenance.container .status {
    display: inline-block;
    background-color: gray;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
}

.maintenance.container .status.green {
    background-color: limegreen;
}

.maintenance.container .status.red {
    background-color: crimson;
}

.admin-message-box {
    border: 4px solid var(--mw-dark-blue);
    border-radius: 8px;
    max-width: 30rem;
    margin: 0 auto 1rem;
}

.admin-message-box > header, .admin-message-box > .message {
    font-family: var(--mw-font-family);
    padding: 0.5rem;
    text-wrap-mode: wrap;
}

.maintenance.container footer {
    font-size: 0.9rem;
    padding-block: 0.5rem;
}</style>
</head>

  <script>
    function reloadMisskingway() {
      if (window.location.host == "invillage-outvillage.com") {
        window.location.reload(true);
      } else {
        window.location.href = "https://invillage-outvillage.com/";
      }
    }
    async function isMisskingwayOnline() {
      const apiStatus = await fetch("https://invillage-outvillage.com/api/get-online-users-count")
        .then(r => r.json())
        .catch(e => false);
      return !!apiStatus;
    }
    async function updateStatus() {
      const isOnline = await isMisskingwayOnline();
      const button = document.getElementById("misskingway-reload-button");
      const status = document.getElementById("misskingway-status");
      button.disabled = !isOnline;
      status.className = `status ${isOnline ? "green" : "red"}`;
      status.title = isOnline ? "オンライン" : "オフライン";
      return isOnline
    }
    async function updateAdminMessage() {
      const message = await fetch("https://raw.githubusercontent.com/nakajima0528/Misskingway/refs/heads/Misskingway/data/message.txt")
        .then(r => r.text())
        .catch(e => "[エラーが発生しました]");
      const box = document.getElementById("admin-message-box");
      const messageTag = document.getElementById("admin-message-body");
      const isEmpty = message.length === 0;
      box.hidden = isEmpty;
      messageTag.innerText = message;
    }
    async function update() {
      const [o, m] = await Promise.all([updateStatus(), updateAdminMessage()]);
      setTimeout(update, o ? 60000 : 15000);
    }
    update();
  </script>
