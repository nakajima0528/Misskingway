<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>Misskingwayはメンテナンス中です</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
@charset "utf-8";
/* CSS Document */

html {
    font-family: "Yu Gothic medium", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "sans-serif", Meiryo;
    color: #000000;
    scroll-behavior: smooth;
    box-sizing: border-box !important;
}

*,
*:before,
*:after {
    box-sizing: inherit;
}

body {
	width: 100%;
    height: auto;
    overflow: auto;
    font-size: 17px;
    position: relative;
    box-sizing: border-box;
		margin: 0 0;
		padding: 0 0;
}

article,
aside,
details,
figcaption,
figure,
footer,
header,
hgroup,
menu,
nav,
section {
    display: block;
    margin: 0 0;
    padding: 0 0;
}

header {
    padding: 0 0;
    margin: 0 0;
    font-weight: 600;
    width: 100%;
}

h1 {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 1rem 0;
}

a,
a:hover {
    text-decoration: none;
}

p {
    margin-bottom: 0;
    font-size: 15px;
    line-height: 1.5rem;
}

ul {
    list-style: none;
    padding: 0 0;
    margin: 0 0;
}

table {
    width: 100%;
    padding: 0 0;
    margin: 0 0;
}

img {
    width: 100%;
    height: auto;
}

.wrap {
	width: 100vw;
	height: 100vh;
	margin: 0 0;
	position: relative;
}

.mainte {
	width: 90%;
	max-width: 850px;
	border: 5px solid #0e3e92;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%,-50%);
}
.mainte .gomeiwaku {
	text-align: center;
	background: #0e3e92;
	color: #fff;
	letter-spacing: 5px;
	font-size: 2.5rem;
	margin: 0 0;
	padding: 20px 0;
	font-weight: 900;
	line-height: 1;
}
.mainte .gomeiwaku span {
	font-size: 1.4rem;
}
.mainte .mainte_text {
	text-align: center;
	display: table;
	margin: 0 auto;
	letter-spacing: 5px;
	width: 100%;
	padding: 2rem;
}
.mainte .mainte_text p {
	font-size: 2rem;
	line-height: 1.5;
	font-weight: 900;
	margin: 0 auto;
	padding-bottom: 1.5rem;
	border-bottom: 3px solid #0e3e92;
}
.mainte img {
	width: 17rem;
	height: auto;
	display: inline-block;
	vertical-align: bottom;
}

.mainte .mainte_text .error_lepo {
	text-align: center;
}
.mainte .mainte_text .error_lepo img {
	width: 190px;
	margin: 20px auto;
}
.mainte .mainte_text .error_lepo p {
	font-size: 1.2rem;
	border-bottom: 0;
}

@media screen and (max-width: 600px){
	.mainte {
		width: 90%;
		max-width: unset;
	}
	.mainte .gomeiwaku {
		font-size: 1.6rem;
	}
	.mainte .gomeiwaku span {
		font-size: 1.2rem;
	}
	.mainte .mainte_text {
    padding: 2rem 0.8rem;
	}
	.mainte .mainte_text p {
		font-size: 1.5rem;
    letter-spacing: 3px;
	}
	.mainte img {
		width: 13rem;
		height: auto;
		display: inline-block;
		vertical-align: bottom;
	}
	
	.error_lepo {
		text-align: center;
	}
	.error_lepo img {
    width: 180px;
    margin: 19px auto;
	}	
	
}
    </style>
</head>
